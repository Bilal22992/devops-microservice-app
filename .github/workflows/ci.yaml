name: Build Images

on:
  push:
    branches:
      - main

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Backend
        run: |
          docker build \
          -t ${{ secrets.DOCKERHUB_USERNAME }}/backend:${IMAGE_TAG} \
          ./backend

      - name: Push Backend
        run: |
          docker push \
          ${{ secrets.DOCKERHUB_USERNAME }}/backend:${IMAGE_TAG}

      - name: Build Frontend
        run: |
          docker build \
          -t ${{ secrets.DOCKERHUB_USERNAME }}/frontend:${IMAGE_TAG} \
          ./frontend

      - name: Push Frontend
        run: |
          docker push \
          ${{ secrets.DOCKERHUB_USERNAME }}/frontend:${IMAGE_TAG}
